    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            background: radial-gradient(circle at top, #0b1124 0%, #060813 100%); 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            color: #f1f5f9; 
            overflow-x: hidden; 
        }
        
        .modern-glass { 
            background: rgba(13, 19, 38, 0.75); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); 
        }

        .server-btn-active {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: #020617;
            font-weight: 800;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Seekbar */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: #1e293b;
            border-radius: 8px;
            height: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px; background: #06b6d4;
            border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px #06b6d4;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Fullscreen */
        #playerContainer:fullscreen { width: 100vw !important; height: 100vh !important; }
        #playerContainer:-webkit-full-screen { width: 100vw !important; height: 100vh !important; }

        audio::-webkit-media-controls-panel { background-color: #0d1326; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-6 border-x border-slate-900 flex flex-col justify-between">

    <!-- Sticky Video Player -->
    <div class="sticky top-[61px] z-40 bg-black shadow-2xl">
        <div id="playerContainer" onmousemove="userActivityTrigger()" ontouchstart="userActivityTrigger()" class="relative w-full aspect-video bg-black overflow-hidden flex items-center justify-center select-none">
            
            <!-- Video Loader -->
            <div id="videoLoader" class="absolute inset-0 flex flex-col items-center justify-center bg-black/90 z-20 gap-2">

                <span class="text-xs text-slate-400 font-bold tracking-wide">Connecting Tr Tv Stream...</span>
            </div>

            <!-- HTML5 Video Element -->
            <video id="videoPlayer" onclick="togglePlay()" class="w-full h-full object-contain cursor-pointer" playsinline crossorigin="anonymous"></video>

            <!-- Iframe Player Fallback -->
            <iframe id="iframePlayer" class="w-full h-full hidden z-10" frameborder="0" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>

            <!-- Custom Controls Overlay -->
            <div id="customControls" class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-black/40 transition-opacity duration-300 flex flex-col justify-between p-3 z-10 opacity-100">

                    <button onclick="reloadStream()" class="text-slate-300 hover:text-cyan-400 text-xs bg-black/60 p-2 rounded-xl border border-white/10 active:rotate-180 transition duration-300"><i class="fa-solid fa-rotate-right"></i></button>

                <button onclick="togglePlay()" class="pointer-events-auto self-center w-12 h-12 rounded-full bg-cyan-400 text-slate-950 flex items-center justify-center text-lg shadow-[0_0_20px_rgba(6,182,212,0.5)] hover:scale-110 active:scale-95 transition">

                    <div class="flex items-center justify-between text-[11px] font-bold text-slate-300">

        <!-- Multi-Server Selector -->

    <!-- Main Section -->

        <!-- Title, Chat Trigger Icon & Viewers/Like Bar -->

            <div class="flex items-center justify-between gap-2">
                <h1 class="text-xs font-extrabold text-white tracking-wide truncate">Tr Tv - Live Sports HD</h1>
                
                <!-- HD Live এর জায়গায় Chat Icon Button -->

        <!-- Hidden by Default Live Chat Box -->

            <!-- Image Upload Preview -->

                    <input type="file" id="chatImageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                    <button type="button" onclick="document.getElementById('chatImageInput').click()" title="Send Image" class="w-8 h-8 rounded-xl bg-[#070b18] border border-white/10 text-slate-400 hover:text-cyan-400 flex items-center justify-center text-xs shrink-0 active:scale-90 transition">
                        <i class="fa-regular fa-image"></i>

                    <button type="button" onclick="startVoiceRecording()" title="Record Voice" class="w-8 h-8 rounded-xl bg-[#070b18] border border-white/10 text-slate-400 hover:text-rose-400 flex items-center justify-center text-xs shrink-0 active:scale-90 transition">
                        <i class="fa-solid fa-microphone"></i>

                    <input type="text" id="chatMessageInput" placeholder="Type a message..." class="flex-1 min-w-0 bg-[#070b18] border border-white/10 text-white text-[11px] rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500 shadow-inner">
                    
                    <button type="submit" id="chatSendBtn" class="bg-cyan-400 hover:bg-cyan-300 text-slate-950 w-8 h-8 rounded-xl text-xs font-bold flex items-center justify-center shrink-0 active:scale-90 transition shadow-md shadow-cyan-500/20">
                        <i class="fa-solid fa-paper-plane text-[11px]"></i>
                    </button>
                </form>

                <!-- Voice Recording Controls -->
                <div id="voiceRecordingBox" class="hidden flex items-center justify-between gap-2 bg-rose-950/40 px-3 py-2 rounded-2xl border border-rose-500/30 w-full">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 bg-rose-500 rounded-full animate-ping"></span>
                        <span class="text-rose-400 font-bold text-xs">Recording...</span>
                        <span id="recordingTimer" class="text-white font-mono text-xs font-bold">00:00</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="cancelVoiceRecording()" class="w-8 h-8 rounded-xl bg-slate-900 text-rose-400 border border-white/10 flex items-center justify-center text-xs">

                        <button type="button" onclick="stopAndSendVoiceRecording()" class="w-8 h-8 rounded-xl bg-rose-500 text-white flex items-center justify-center text-xs shadow-lg shadow-rose-500/30">
                            <i class="fa-solid fa-paper-plane"></i>

                </div>
            </div>

        <!-- ==============================================================
             [ADSTERRA] 3. Banner Ad Slot (সম্পূর্ণ ফাঁকা ও ক্লিন কন্টেইনার)
             ============================================================== -->
        <div id="adsterra-banner-container" class="w-full flex justify-center items-center overflow-hidden my-1 min-h-0">
            <!-- এখানে আপনার Adsterra Script / Banner কোড বসিয়ে দিন -->
        </div>

    </main>

    <!-- Clean Modern Footer -->
    <footer class="text-center py-3 border-t border-white/5">
        <a href="https://trtvlive.netlify.app" target="_blank" class="text-[11px] font-bold text-slate-500 hover:text-cyan-400 transition tracking-wider">
            trtvlive.netlify.app
        </a>
    </footer>

    <script>
        // ==========================================================
        //  ১. কাস্টম ৫টি সার্ভার লিংক (এখানে আপনার লিংকগুলো দিন)
        // ==========================================================
        const customServers = [
            { name: "Server 1", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }, 
            { name: "Server 2", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }, 
            { name: "Server 3", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }, 
            { name: "Server 4", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }, 
            { name: "Server 5", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }  
        ];

        const WEBSITE_URL = "https://trtvlive.netlify.app";

        // ==========================================================
        //  ২. Firebase Config (Live Watching & Chat)
        // ==========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
            authDomain: "new-all-f99f7.firebaseapp.com",
            databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
            projectId: "new-all-f99f7",
            storageBucket: "new-all-f99f7.firebasestorage.app",
            messagingSenderId: "1069748173900",
            appId: "1:1069748173900:web:158d6336c0f4628133c8e9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const chatId = "tr_tv_live_main";

        // User setup
        if (!localStorage.getItem('trtv_user_id')) {
            localStorage.setItem('trtv_user_id', 'user_' + Math.random().toString(36).substr(2, 9));
        }
        const userId = localStorage.getItem('trtv_user_id');

        if (!localStorage.getItem('trtv_user_name')) {
            localStorage.setItem('trtv_user_name', 'Fan_' + Math.floor(1000 + Math.random() * 9000));
        }
        const nameInput = document.getElementById('userNameInput');
        nameInput.value = localStorage.getItem('trtv_user_name');
        nameInput.addEventListener('change', () => {
            if(nameInput.value.trim()) localStorage.setItem('trtv_user_name', nameInput.value.trim());
        });

        // ==========================================================
        //  ৩. Realtime Watching Counter (Firebase Presence)
        // ==========================================================
        function setupLiveWatching() {
            const myViewerRef = db.ref(`trtv_watching/${userId}`);
            const allViewersRef = db.ref(`trtv_watching`);

            db.ref('.info/connected').on('value', snap => {
                if (snap.val() === true) {
                    myViewerRef.onDisconnect().remove();
                    myViewerRef.set({ onlineAt: firebase.database.ServerValue.TIMESTAMP });
                }
            });

            allViewersRef.on('value', snap => {
                const count = snap.numChildren() || 1;
                document.getElementById('realViewerCount').innerText = `${count} Watching`;
            });
        }

        // ==========================================================
        //  ৪. Video Player & 5 Servers
        // ==========================================================
        let activeUrl = '';
        let hlsInstance = null;
        const video = document.getElementById('videoPlayer');
        const iframe = document.getElementById('iframePlayer');
        const loader = document.getElementById('videoLoader');
        const customControls = document.getElementById('customControls');
        let controlsHideTimeout = null;

        function initServers() {
            const srvBox = document.getElementById('serverButtons');
            srvBox.innerHTML = '';

            customServers.forEach((srv, i) => {
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-1.5 rounded-xl text-[10px] transition active:scale-95 ${i === 0 ? 'server-btn-active' : 'bg-[#0e1428] text-slate-300 border border-white/10 font-bold'}`;
                btn.innerText = srv.name;
                btn.onclick = () => {
                    document.querySelectorAll('#serverButtons button').forEach(b => {
                        b.className = 'px-3.5 py-1.5 rounded-xl text-[10px] transition active:scale-95 bg-[#0e1428] text-slate-300 border border-white/10 font-bold';
                    });
                    btn.className = 'px-3.5 py-1.5 rounded-xl text-[10px] transition active:scale-95 server-btn-active';
                    playSource(srv.url);
                };
                srvBox.appendChild(btn);
            });

            if (customServers.length > 0) {
                playSource(customServers[0].url);
            }
        }

        function isDirectVideoUrl(url) {
            if (!url) return false;
            const u = url.trim().toLowerCase();
            return u.includes('.m3u8') || u.includes('.mp4') || u.includes('.ts');
        }

        function playSource(url) {
            activeUrl = url;
            loader.classList.remove('hidden');

            const directStream = isDirectVideoUrl(url);

            if (!directStream) {
                if (hlsInstance) hlsInstance.destroy();
                video.pause();
                video.classList.add('hidden');
                customControls.classList.add('hidden');
                iframe.classList.remove('hidden');
                iframe.src = url;
                loader.classList.add('hidden');
            } else {
                iframe.classList.add('hidden');
                iframe.src = '';
                video.classList.remove('hidden');
                customControls.classList.remove('hidden');

                if (Hls.isSupported() && url.includes('.m3u8')) {
                    if (hlsInstance) hlsInstance.destroy();
                    hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        loader.classList.add('hidden');
                        video.play().catch(() => {});
                    });
                } else {
                    video.src = url;
                    video.addEventListener('loadeddata', () => {
                        loader.classList.add('hidden');
                        video.play().catch(() => {});
                    }, { once: true });
                }
            }
        }

        function userActivityTrigger() {
            if (iframe.classList.contains('hidden')) {
                customControls.style.opacity = "1";
                customControls.style.pointerEvents = "auto";
                clearTimeout(controlsHideTimeout);
                if (!video.paused) {
                    controlsHideTimeout = setTimeout(() => {
                        customControls.style.opacity = "0";
                        customControls.style.pointerEvents = "none";
                    }, 3000);
                }
            }
        }

        function togglePlay() {
            if (video.paused) video.play().catch(() => {});
            else video.pause();
            userActivityTrigger();
        }

        function toggleMute() {
            video.muted = !video.muted;
            document.getElementById('muteIcon').className = video.muted ? "fa-solid fa-volume-xmark text-rose-500" : "fa-solid fa-volume-high";
            userActivityTrigger();
        }

        function reloadStream() { if (activeUrl) playSource(activeUrl); }

        async function toggleFullscreen() {
            const container = document.getElementById('playerContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) await container.requestFullscreen();
            } else {
                if (document.exitFullscreen) await document.exitFullscreen();
            }
        }

        video.addEventListener('play', () => {
            document.getElementById('playIcon').className = "fa-solid fa-pause";
            document.getElementById('bottomPlayIcon').className = "fa-solid fa-pause text-cyan-400";
        });
        video.addEventListener('pause', () => {
            document.getElementById('playIcon').className = "fa-solid fa-play ml-0.5";
            document.getElementById('bottomPlayIcon').className = "fa-solid fa-play text-cyan-400";
        });

        // ==========================================================
        //  ৫. Live Chat Open/Close & Logic
        // ==========================================================
        let isChatOpen = false;
        let isChatInitialized = false;

        function toggleChatSection() {
            const wrapper = document.getElementById('liveChatWrapper');
            isChatOpen = !isChatOpen;
            if (isChatOpen) {
                wrapper.classList.remove('hidden');
                wrapper.classList.add('flex');
                if (!isChatInitialized) {
                    setupLiveChat();
                    isChatInitialized = true;
                }
            } else {
                wrapper.classList.add('hidden');
                wrapper.classList.remove('flex');
            }
        }

        const IMGBB_API_KEY = "4f29b88d8207f6e762c2c852d5c895f8";
        let selectedChatImageFile = null;

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedChatImageFile = file;
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('previewImgElement').src = e.target.result;
                    document.getElementById('previewImgName').innerText = file.name;
                    document.getElementById('chatImagePreview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function cancelImageSelection() {
            selectedChatImageFile = null;
            document.getElementById('chatImageInput').value = '';
            document.getElementById('chatImagePreview').classList.add('hidden');
        }

        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await res.json();
            if (data && data.success) return data.data.url;
            throw new Error("Image upload failed");
        }

        function setupLiveChat() {
            const chatBox = document.getElementById('chatMessages');
            db.ref(`chats/${chatId}`).limitToLast(35).on('value', snap => {
                chatBox.innerHTML = '';
                const data = snap.val();
                if (data) {
                    Object.keys(data).forEach(k => {
                        const msg = data[k];
                        const initial = (msg.name || 'U').charAt(0).toUpperCase();
                        let contentHTML = '';

                        if (msg.image) {
                            contentHTML += `<div class="mt-1 mb-1"><a href="${msg.image}" target="_blank"><img src="${msg.image}" class="max-w-[180px] max-h-40 rounded-xl object-cover border border-white/10 shadow-md"></a></div>`;
                        }
                        if (msg.audio) {
                            contentHTML += `<div class="mt-1"><audio controls class="w-full h-8 max-w-[200px] rounded-lg"><source src="${msg.audio}"></audio></div>`;
                        }
                        if (msg.text) {
                            contentHTML += `<p class="text-[11px] text-slate-200 break-words">${msg.text}</p>`;
                        }

                        chatBox.innerHTML += `
                            <div class="flex items-start gap-2 bg-[#070b18]/80 p-2.5 rounded-2xl border border-white/5">
                                <div class="w-6 h-6 rounded-full bg-cyan-500/20 text-cyan-400 font-extrabold text-[10px] flex items-center justify-center shrink-0 border border-cyan-500/30">${initial}</div>
                                <div class="overflow-hidden flex-1 space-y-0.5">
                                    <div class="flex items-center justify-between">
                                        <span class="font-extrabold text-[10px] text-cyan-400 truncate">${msg.name || 'Fan'}</span>
                                        <span class="text-[8px] text-slate-500">${msg.time || ''}</span>
                                    </div>
                                    ${contentHTML}
                                </div>
                            </div>`;
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                } else {
                    chatBox.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">No messages yet. Say hello on Tr Tv!</p>`;
                }
            });
        }

        async function sendMessage(e) {
            e.preventDefault();
            const msgInput = document.getElementById('chatMessageInput');
            const sendBtn = document.getElementById('chatSendBtn');
            const text = msgInput.value.trim();
            const name = document.getElementById('userNameInput').value.trim() || 'Fan';

            if (!text && !selectedChatImageFile) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let uploadedImageUrl = null;

            if (selectedChatImageFile) {
                sendBtn.disabled = true;
                sendBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-[10px]"></i>';
                try {
                    uploadedImageUrl = await uploadImageToImgBB(selectedChatImageFile);
                } catch(err) {
                    alert("Image upload failed");
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
                    return;
                }
            }

            const payload = { name: name, time: timeStr, timestamp: Date.now() };
            if (text) payload.text = text;
            if (uploadedImageUrl) payload.image = uploadedImageUrl;

            db.ref(`chats/${chatId}`).push(payload);
            msgInput.value = '';
            cancelImageSelection();
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
        }

        // Voice Message Setup
        let mediaRecorder = null;
        let audioChunks = [];
        let recordInterval = null;
        let recordSeconds = 0;
        let isCancelled = false;

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                isCancelled = false;

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    clearInterval(recordInterval);
                    if (!isCancelled && audioChunks.length > 0) {
                        const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const name = document.getElementById('userNameInput').value.trim() || 'Fan';
                            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                            db.ref(`chats/${chatId}`).push({ name: name, audio: reader.result, time: timeStr, timestamp: Date.now() });
                        };
                    }
                };

                mediaRecorder.start();
                recordSeconds = 0;
                document.getElementById('recordingTimer').innerText = "00:00";
                document.getElementById('standardChatForm').classList.add('hidden');
                document.getElementById('voiceRecordingBox').classList.remove('hidden');

                recordInterval = setInterval(() => {
                    recordSeconds++;
                    const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
                    const s = String(recordSeconds % 60).padStart(2, '0');
                    document.getElementById('recordingTimer').innerText = `${m}:${s}`;
                }, 1000);
            } catch(e) {
                alert("Microphone permission denied.");
            }
        }

        function cancelVoiceRecording() {
            isCancelled = true;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            document.getElementById('voiceRecordingBox').classList.add('hidden');
            document.getElementById('standardChatForm').classList.remove('hidden');
        }

        function stopAndSendVoiceRecording() {
            isCancelled = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            document.getElementById('voiceRecordingBox').classList.add('hidden');
            document.getElementById('standardChatForm').classList.remove('hidden');
        }

        // Share Functions
        function openShareModal() {
            document.getElementById('shareOverlay').classList.remove('hidden');
            document.getElementById('shareModal').classList.remove('hidden');
        }
        function closeShareModal() {
            document.getElementById('shareOverlay').classList.add('hidden');
            document.getElementById('shareModal').classList.add('hidden');
        }
        function shareSocial(p) {
            const url = WEBSITE_URL;
            const text = "Watch Live on Tr Tv:";
            let link = '';
            if (p === 'whatsapp') link = `https://api.whatsapp.com/send?text=${encodeURIComponent(text + ' ' + url)}`;
            if (p === 'telegram') link = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
            if (p === 'facebook') link = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
            if (p === 'twitter') link = `https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
            if (link) window.open(link, '_blank');
        }
        function copyShareLink() {
            navigator.clipboard.writeText(WEBSITE_URL);
            document.getElementById('copyBtnText').innerText = "Copied!";
            setTimeout(() => { document.getElementById('copyBtnText').innerText = "Copy Website Link"; }, 2000);
        }

        function handleLike() {
            const current = parseInt(document.getElementById('likeCountText').innerText) || 0;
            document.getElementById('likeCountText').innerText = current + 1;
            document.getElementById('likeBtn').classList.add('bg-rose-500/20', 'border-rose-500/50');
        }

        // Init
        initServers();
        setupLiveWatching();
    </script>
</body>
