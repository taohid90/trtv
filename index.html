    <script>
        // ==========================================================
        //  ১. ৫টি সার্ভার লিংক
        // ==========================================================
        const customServers = [
            { name: "Server 1 (HD)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }, 
            { name: "Server 2 (Auto)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }, 
            { name: "Server 3 (Backup)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }, 
            { name: "Server 4 (Low)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }, 
            { name: "Server 5 (HQ)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }  
        ];

        const WEBSITE_URL = "https://trtvlive.netlify.app";

        // ==========================================================
        //  ২. Firebase Config
        // ==========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
            authDomain: "new-all-f99f7.firebaseapp.com",
            databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
            projectId: "new-all-f99f7",
            storageBucket: "new-all-f99f7.firebasestorage.app",
            messagingSenderId: "1069748173900",
            appId: "1:1069748173900:web:158d6336c0f4628133c8e9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const chatId = "tr_tv_live_main";

        // User Setup
        if (!localStorage.getItem('trtv_user_id')) {
            localStorage.setItem('trtv_user_id', 'user_' + Math.random().toString(36).substr(2, 9));
        }
        const userId = localStorage.getItem('trtv_user_id');

        if (!localStorage.getItem('trtv_user_name')) {
            localStorage.setItem('trtv_user_name', 'Fan_' + Math.floor(1000 + Math.random() * 9000));
        }
        const nameInput = document.getElementById('userNameInput');
        nameInput.value = localStorage.getItem('trtv_user_name');
        nameInput.addEventListener('change', () => {
            if(nameInput.value.trim()) localStorage.setItem('trtv_user_name', nameInput.value.trim());
        });

        // ==========================================================
        //  ৩. Realtime Watching Counter
        // ==========================================================
        function setupLiveWatching() {
            const myViewerRef = db.ref(`trtv_watching/${userId}`);
            const allViewersRef = db.ref(`trtv_watching`);

            db.ref('.info/connected').on('value', snap => {
                if (snap.val() === true) {
                    myViewerRef.onDisconnect().remove();
                    myViewerRef.set({ onlineAt: firebase.database.ServerValue.TIMESTAMP });
                }
            });

            allViewersRef.on('value', snap => {
                const count = snap.numChildren() || 1;
                document.getElementById('realViewerCount').innerText = `${count} Watching`;
            });
        }

        // ==========================================================
        //  ৪. Video Player Logic (Autoplay, Fit Modes, PiP & Controls)
        // ==========================================================
        let activeUrl = '';
        let hlsInstance = null;
        const video = document.getElementById('videoPlayer');
        const iframe = document.getElementById('iframePlayer');
        const loader = document.getElementById('videoLoader');
        const customControls = document.getElementById('customControls');
        const unmuteAlertBtn = document.getElementById('unmuteAlertBtn');
        let controlsHideTimeout = null;

        // Fit Modes List
        const fitModes = [
            { cls: 'object-contain', name: 'Fit: Normal' },
            { cls: 'object-cover', name: 'Fit: Cover' },
            { cls: 'object-fill', name: 'Fit: Stretch' }
        ];
        let currentFitIdx = 0;

        function showPlayerToast(text) {
            const toast = document.getElementById('playerToast');
            toast.innerText = text;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        function toggleFitMode() {
            currentFitIdx = (currentFitIdx + 1) % fitModes.length;
            video.className = `w-full h-full cursor-pointer transition-all duration-150 ${fitModes[currentFitIdx].cls}`;
            document.getElementById('fitModeText').innerText = fitModes[currentFitIdx].name.split(':')[1].trim();
            showPlayerToast(fitModes[currentFitIdx].name);
        }

        async function togglePiP() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                    showPlayerToast("PiP: Disabled");
                } else if (document.pictureInPictureEnabled) {
                    await video.requestPictureInPicture();
                    showPlayerToast("PiP: Active");
                }
            } catch (err) {
                console.error("PiP error:", err);
            }
        }

        function initServers() {
            const srvBox = document.getElementById('serverButtons');
            srvBox.innerHTML = '';

            customServers.forEach((srv, i) => {
                const btn = document.createElement('button');
                btn.className = `px-2.5 py-1 rounded text-[11px] transition shrink-0 ${i === 0 ? 'server-btn-active' : 'bg-slate-800 text-slate-300 border border-slate-700 hover:text-white font-medium'}`;
                btn.innerText = srv.name;
                btn.onclick = () => {
                    document.querySelectorAll('#serverButtons button').forEach(b => {
                        b.className = 'px-2.5 py-1 rounded text-[11px] transition shrink-0 bg-slate-800 text-slate-300 border border-slate-700 hover:text-white font-medium';
                    });
                    btn.className = 'px-2.5 py-1 rounded text-[11px] transition shrink-0 server-btn-active';
                    playSource(srv.url);
                };
                srvBox.appendChild(btn);
            });

            if (customServers.length > 0) {
                playSource(customServers[0].url);
            }
        }

        function isDirectVideoUrl(url) {
            if (!url) return false;
            const u = url.trim().toLowerCase();
            return u.includes('.m3u8') || u.includes('.mp4') || u.includes('.ts');
        }

        function playSource(url) {
            activeUrl = url;
            loader.classList.remove('hidden');

            const directStream = isDirectVideoUrl(url);

            if (!directStream) {
                if (hlsInstance) hlsInstance.destroy();
                video.pause();
                video.classList.add('hidden');
                customControls.classList.add('hidden');
                unmuteAlertBtn.classList.add('hidden');
                iframe.classList.remove('hidden');
                iframe.src = url;
                loader.classList.add('hidden');
            } else {
                iframe.classList.add('hidden');
                iframe.src = '';
                video.classList.remove('hidden');
                customControls.classList.remove('hidden');

                // Autoplay Policy: Always start muted for guaranteed autoplay
                video.muted = true;
                document.getElementById('muteIcon').className = "fa-solid fa-volume-xmark text-rose-400";
                unmuteAlertBtn.classList.remove('hidden');

                if (Hls.isSupported() && url.includes('.m3u8')) {
                    if (hlsInstance) hlsInstance.destroy();
                    hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        loader.classList.add('hidden');
                        video.play().catch(e => console.log("Autoplay caught:", e));
                    });
                } else {
                    video.src = url;
                    video.addEventListener('loadeddata', () => {
                        loader.classList.add('hidden');
                        video.play().catch(e => console.log("Autoplay caught:", e));
                    }, { once: true });
                }
            }
        }

        function userActivityTrigger() {
            if (iframe.classList.contains('hidden')) {
                customControls.style.opacity = "1";
                customControls.style.pointerEvents = "auto";
                clearTimeout(controlsHideTimeout);
                if (!video.paused) {
                    controlsHideTimeout = setTimeout(() => {
                        customControls.style.opacity = "0";
                        customControls.style.pointerEvents = "none";
                    }, 3000);
                }
            }
        }

        function togglePlay() {
            if (video.paused) video.play().catch(() => {});
            else video.pause();
            userActivityTrigger();
        }

        function toggleMute() {
            video.muted = !video.muted;
            if (!video.muted) {
                unmuteAlertBtn.classList.add('hidden');
                document.getElementById('muteIcon').className = "fa-solid fa-volume-high text-white";
                showPlayerToast("Sound: Unmuted");
            } else {
                document.getElementById('muteIcon').className = "fa-solid fa-volume-xmark text-rose-400";
                showPlayerToast("Sound: Muted");
            }
            userActivityTrigger();
        }

        function reloadStream() { 
            if (activeUrl) playSource(activeUrl); 
            showPlayerToast("Stream Reloaded");
        }

        async function toggleFullscreen() {
            const container = document.getElementById('playerContainer');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) await container.requestFullscreen();
                else if (container.webkitRequestFullscreen) await container.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) await document.exitFullscreen();
                else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
            }
        }

        video.addEventListener('play', () => {
            document.getElementById('playIcon').className = "fa-solid fa-pause";
            document.getElementById('bottomPlayIcon').className = "fa-solid fa-pause text-sky-400";
        });
        video.addEventListener('pause', () => {
            document.getElementById('playIcon').className = "fa-solid fa-play ml-0.5";
            document.getElementById('bottomPlayIcon').className = "fa-solid fa-play text-sky-400";
        });

        // ==========================================================
        //  ৫. Live Chat Open/Close & Logic
        // ==========================================================
        let isChatOpen = false;
        let isChatInitialized = false;

        function toggleChatSection() {
            const wrapper = document.getElementById('liveChatWrapper');
            isChatOpen = !isChatOpen;
            if (isChatOpen) {
                wrapper.classList.remove('hidden');
                wrapper.classList.add('flex');
                if (!isChatInitialized) {
                    setupLiveChat();
                    isChatInitialized = true;
                }
            } else {
                wrapper.classList.add('hidden');
                wrapper.classList.remove('flex');
            }
        }

        const IMGBB_API_KEY = "4f29b88d8207f6e762c2c852d5c895f8";
        let selectedChatImageFile = null;

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedChatImageFile = file;
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('previewImgElement').src = e.target.result;
                    document.getElementById('previewImgName').innerText = file.name;
                    document.getElementById('chatImagePreview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function cancelImageSelection() {
            selectedChatImageFile = null;
            document.getElementById('chatImageInput').value = '';
            document.getElementById('chatImagePreview').classList.add('hidden');
        }

        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await res.json();
            if (data && data.success) return data.data.url;
            throw new Error("Image upload failed");
        }

        function setupLiveChat() {
            const chatBox = document.getElementById('chatMessages');
            db.ref(`chats/${chatId}`).limitToLast(35).on('value', snap => {
                chatBox.innerHTML = '';
                const data = snap.val();
                if (data) {
                    Object.keys(data).forEach(k => {
                        const msg = data[k];
                        const initial = (msg.name || 'U').charAt(0).toUpperCase();
                        let contentHTML = '';

                        if (msg.image) {
                            contentHTML += `<div class="mt-1"><a href="${msg.image}" target="_blank"><img src="${msg.image}" class="max-w-[170px] max-h-36 rounded object-cover border border-slate-700"></a></div>`;
                        }
                        if (msg.audio) {
                            contentHTML += `<div class="mt-1"><audio controls class="w-full h-8 max-w-[200px] rounded"><source src="${msg.audio}"></audio></div>`;
                        }
                        if (msg.text) {
                            contentHTML += `<p class="text-[11px] text-slate-200 break-words leading-relaxed">${msg.text}</p>`;
                        }

                        chatBox.innerHTML += `
                            <div class="flex items-start gap-2 bg-slate-900/90 p-2 rounded-lg border border-slate-800">
                                <div class="w-6 h-6 rounded bg-sky-500/20 text-sky-400 font-bold text-[10px] flex items-center justify-center shrink-0 border border-sky-500/30">${initial}</div>
                                <div class="overflow-hidden flex-1 space-y-0.5">
                                    <div class="flex items-center justify-between">
                                        <span class="font-bold text-[10px] text-sky-400 truncate">${msg.name || 'Fan'}</span>
                                        <span class="text-[8px] text-slate-500">${msg.time || ''}</span>
                                    </div>
                                    ${contentHTML}
                                </div>
                            </div>`;
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                } else {
                    chatBox.innerHTML = `<p class="text-center text-slate-500 text-xs py-6">No messages yet. Be the first to comment!</p>`;
                }
            });
        }

        async function sendMessage(e) {
            e.preventDefault();
            const msgInput = document.getElementById('chatMessageInput');
            const sendBtn = document.getElementById('chatSendBtn');
            const text = msgInput.value.trim();
            const name = document.getElementById('userNameInput').value.trim() || 'Fan';

            if (!text && !selectedChatImageFile) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let uploadedImageUrl = null;

            if (selectedChatImageFile) {
                sendBtn.disabled = true;
                sendBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-[10px]"></i>';
                try {
                    uploadedImageUrl = await uploadImageToImgBB(selectedChatImageFile);
                } catch(err) {
                    alert("Image upload failed");
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
                    return;
                }
            }

            const payload = { name: name, time: timeStr, timestamp: Date.now() };
            if (text) payload.text = text;
            if (uploadedImageUrl) payload.image = uploadedImageUrl;

            db.ref(`chats/${chatId}`).push(payload);
            msgInput.value = '';
            cancelImageSelection();
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
        }

        // Voice Message Setup
        let mediaRecorder = null;
        let audioChunks = [];
        let recordInterval = null;
        let recordSeconds = 0;
        let isCancelled = false;

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                isCancelled = false;

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    clearInterval(recordInterval);
                    if (!isCancelled && audioChunks.length > 0) {
                        const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const name = document.getElementById('userNameInput').value.trim() || 'Fan';
                            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                            db.ref(`chats/${chatId}`).push({ name: name, audio: reader.result, time: timeStr, timestamp: Date.now() });
                        };
                    }
                };

                mediaRecorder.start();
                recordSeconds = 0;
                document.getElementById('recordingTimer').innerText = "00:00";
                document.getElementById('standardChatForm').classList.add('hidden');
                document.getElementById('voiceRecordingBox').classList.remove('hidden');

                recordInterval = setInterval(() => {
                    recordSeconds++;
                    const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
                    const s = String(recordSeconds % 60).padStart(2, '0');
                    document.getElementById('recordingTimer').innerText = `${m}:${s}`;
                }, 1000);
            } catch(e) {
                alert("Microphone permission was denied.");
            }
        }

        function cancelVoiceRecording() {
            isCancelled = true;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            document.getElementById('voiceRecordingBox').classList.add('hidden');
            document.getElementById('standardChatForm').classList.remove('hidden');
        }

        function stopAndSendVoiceRecording() {
            isCancelled = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            document.getElementById('voiceRecordingBox').classList.add('hidden');
            document.getElementById('standardChatForm').classList.remove('hidden');
        }

        // Share Functions
        function openShareModal() {
            document.getElementById('shareOverlay').classList.remove('hidden');
            document.getElementById('shareModal').classList.remove('hidden');
        }
        function closeShareModal() {
            document.getElementById('shareOverlay').classList.add('hidden');
            document.getElementById('shareModal').classList.add('hidden');
        }
        function shareSocial(p) {
            const url = WEBSITE_URL;
            const text = "Watch Live on Tr Tv:";
            let link = '';
            if (p === 'whatsapp') link = `https://api.whatsapp.com/send?text=${encodeURIComponent(text + ' ' + url)}`;
            if (p === 'telegram') link = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
            if (p === 'facebook') link = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
            if (p === 'twitter') link = `https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
            if (link) window.open(link, '_blank');
        }
        function copyShareLink() {
            navigator.clipboard.writeText(WEBSITE_URL);
            document.getElementById('copyBtnText').innerText = "Copied!";
            setTimeout(() => { document.getElementById('copyBtnText').innerText = "Copy Stream Link"; }, 2000);
        }

        function handleLike() {
            const current = parseInt(document.getElementById('likeCountText').innerText) || 0;
            document.getElementById('likeCountText').innerText = current + 1;
            document.getElementById('likeBtn').classList.add('bg-rose-500/20', 'border-rose-500/50');
        }

        // Initialize Everything
        initServers();
        setupLiveWatching();
    </script>
